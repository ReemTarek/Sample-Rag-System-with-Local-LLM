services:
  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: minirag-qdrant
    ports:
      - "6333:6333"   # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Optional: run Ollama in Docker instead of on the host.
  # Start with: docker compose --profile ollama up -d
  # GPU passthrough requires the NVIDIA Container Toolkit (Docker Desktop + WSL2 supports it).
  ollama:
    image: ollama/ollama:latest
    container_name: minirag-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_models:
